name: Pipeline Integrado CI/CD De Cero a Producción

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  job-ci:
    name: 1. Integración Continua (Linter y Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3
      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar Linter (Flake8)
        run: flake8 app.py test_app.py
      - name: Ejecutar Pruebas Unitarias (PyTest)
        run: pytest -v

  job-build-docker:
    name: 2. Build de Imagen Inmutable Docker
    needs: job-ci
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3
      - name: Compilar Imagen Docker
        run: |
          docker build -t microservicio:v1 .
          docker images | grep microservicio

  job-cd-multistage:
    name: 3. Despliegue Multietapa (Dev -> Test -> Prod)
    needs: [job-ci, job-build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue en Entorno DEV
        run: echo '[DEV] Desplegando contenedor en ambiente de Desarrollo... OK'
      - name: Despliegue en Entorno STAGING / TEST
        run: echo '[STAGING] Desplegando en ambiente de Pruebas Staging... OK'
      - name: Despliegue en Entorno PRODUCCIÓN
        if: github.ref == 'refs/heads/main'
        run: echo '[PROD] Despliegue exitoso en Producción garantizado por CI/CD.'